name: verify submission

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build runtime submission
        run: python package_submission.py
      - name: Inspect runtime submission
        run: python skills/verify-artifact-delivery/scripts/inspect_artifact.py dist/benchflow-skill-lift-submission.zip
